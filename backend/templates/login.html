{% extends "base.html" %} {% block content %}
<div
  class="min-h-screen bg-slate-100 flex items-center justify-center px-4 py-10"
>
  <div
    class="w-full max-w-md bg-white rounded-3xl border border-slate-200 shadow-xl shadow-slate-200/70 p-8"
  >
    <div class="text-center mb-8">
      <h1 class="text-3xl font-semibold text-slate-900">로그인</h1>
      <p class="mt-3 text-sm text-slate-500">
        계정에 로그인하여 나만의 투두리스트를 관리하세요.
      </p>
    </div>

    {% if error %}
    <div class="mb-5 flex justify-center">
      <div
        class="w-full max-w-sm rounded-3xl border border-rose-200 bg-rose-50 px-5 py-4 text-sm text-rose-700 shadow-lg shadow-rose-100"
      >
        <div class="flex items-center justify-between">
          <div class="font-semibold">로그인 실패</div>
          <span class="text-lg font-bold">!</span>
        </div>
        <div class="mt-2">{{ error }}</div>
      </div>
    </div>
    {% endif %}

    <form action="/login" method="post" class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-700"
          >아이디</label
        >
        <input
          id="username"
          name="username"
          type="text"
          required
          placeholder="사용자 이름"
          class="mt-2 w-full rounded-2xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700"
          >비밀번호</label
        >
        <input
          id="password"
          name="password"
          type="password"
          required
          placeholder="비밀번호"
          class="mt-2 w-full rounded-2xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
        />
      </div>

      <button
        type="submit"
        class="w-full rounded-2xl bg-sky-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2 focus:ring-offset-slate-100"
      >
        로그인
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-slate-500">
      아직 계정이 없으신가요?
      <a href="/signup" class="font-semibold text-sky-600 hover:text-sky-700"
        >회원가입</a
      >
    </div>
  </div>
</div>
{% endblock %}
