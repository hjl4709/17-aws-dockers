{% extends "base.html" %} {% block content %}
<div
  class="min-h-screen bg-slate-100 flex items-center justify-center px-4 py-10"
>
  <div
    class="w-full max-w-2xl rounded-3xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/70"
  >
    <div class="text-center mb-8">
      <h1 class="text-3xl font-semibold text-slate-900">{{ form_title }}</h1>
      <p class="mt-3 text-sm text-slate-500">
        메모를 작성하거나 수정할 수 있습니다.
      </p>
    </div>

    <form action="{{ action_url }}" method="post" class="space-y-6">
      <div>
        <label for="title" class="block text-sm font-medium text-slate-700"
          >메모 제목</label
        >
        <input
          id="title"
          name="title"
          type="text"
          required
          placeholder="제목을 입력하세요"
          value="{{ memo.title if memo }}"
          class="mt-2 w-full rounded-2xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
        />
      </div>

      <div>
        <label for="content" class="block text-sm font-medium text-slate-700"
          >메모 내용</label
        >
        <textarea
          id="content"
          name="content"
          rows="8"
          required
          placeholder="내용을 입력하세요"
          class="mt-2 w-full rounded-3xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
        >
{{ memo.content if memo }}</textarea
        >
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3">
        <a
          href="/memos"
          class="rounded-2xl border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50"
          >취소</a
        >
        <button
          type="submit"
          class="rounded-2xl bg-sky-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-sky-700"
        >
          {{ button_text }}
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
