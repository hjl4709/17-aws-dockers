{% extends "base.html" %} {% block content %}
<div
  class="min-h-screen bg-slate-100 flex items-center justify-center px-4 py-10"
>
  <div
    class="w-full max-w-md bg-white rounded-3xl border border-slate-200 shadow-xl shadow-slate-200/70 p-8"
  >
    <div class="text-center mb-8">
      <h1 class="text-3xl font-semibold text-slate-900">환영합니다</h1>
      <p class="mt-3 text-sm text-slate-500">
        나만의 투두리스트를 시작하고 메모를 관리해보세요.
      </p>
    </div>

    <div class="space-y-4">
      <div class="rounded-3xl border border-slate-200 bg-slate-50 p-5">
        <h2 class="text-lg font-semibold text-slate-900">오늘의 할 일</h2>
        <p class="mt-2 text-sm text-slate-600">
          간단한 메모 작성과 완료 관리로 생산성을 높이세요.
        </p>
      </div>

      {% if user %}
      <div class="flex flex-col gap-3 sm:flex-row">
        <a
          href="/memos"
          class="flex-1 rounded-2xl bg-sky-600 px-5 py-3 text-center text-sm font-semibold text-white transition hover:bg-sky-700"
          >내 메모 보기</a
        >
        <form action="/logout" method="post" class="flex-1">
          <button
            type="submit"
            class="w-full rounded-2xl border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50"
          >
            로그아웃
          </button>
        </form>
      </div>
      {% else %}
      <div class="flex gap-3">
        <a
          href="/login"
          class="flex-1 rounded-2xl bg-sky-600 px-5 py-3 text-center text-sm font-semibold text-white transition hover:bg-sky-700"
          >로그인</a
        >
        <a
          href="/signup"
          class="flex-1 rounded-2xl border border-slate-300 bg-white px-5 py-3 text-center text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50"
          >회원가입</a
        >
      </div>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
