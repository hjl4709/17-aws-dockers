{% extends "base.html" %} {% block content %}
<div class="min-h-screen bg-slate-100 px-4 py-10">
  <div class="mx-auto w-full max-w-4xl">
    <div
      class="mb-8 rounded-3xl border border-slate-200 bg-white p-8 shadow-xl shadow-slate-200/70"
    >
      <div
        class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between"
      >
        <div>
          <h1 class="text-3xl font-semibold text-slate-900">메모 목록</h1>
          <p class="mt-2 text-sm text-slate-500">
            작성한 메모를 한눈에 확인하고 관리할 수 있습니다.
          </p>
        </div>
        <div class="flex flex-wrap gap-3">
          <a
            href="/memos/new"
            class="rounded-2xl bg-sky-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-sky-700"
            >메모 작성</a
          >
          <a
            href="/"
            class="rounded-2xl border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50"
            >홈으로</a
          >
          <a
            href="/logout"
            class="rounded-2xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white transition hover:bg-slate-700"
            >로그아웃</a
          >
        </div>
      </div>
    </div>

    <div class="grid gap-5 md:grid-cols-2">
      {% for memo in memos %}
      <div
        class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm transition hover:shadow-md"
      >
        <div class="flex items-start justify-between gap-4">
          <h2 class="text-xl font-semibold text-slate-900">{{ memo.title }}</h2>
          <div class="flex gap-2">
            <a
              href="/memos/{{ memo.id }}/edit"
              class="rounded-full border border-slate-300 bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-700 transition hover:bg-slate-200"
              >수정</a
            >
            <form action="/memos/{{ memo.id }}/delete" method="post">
              <button
                type="submit"
                class="rounded-full border border-rose-200 bg-rose-50 px-3 py-1 text-xs font-semibold text-rose-600 transition hover:bg-rose-100"
              >
                삭제
              </button>
            </form>
          </div>
        </div>
        <p class="mt-3 text-sm leading-7 text-slate-600">{{ memo.content }}</p>
      </div>
      {% else %}
      <div
        class="col-span-full rounded-3xl border border-dashed border-slate-300 bg-slate-50 p-10 text-center text-slate-600"
      >
        <p class="text-lg font-medium">아직 작성된 메모가 없습니다.</p>
        <p class="mt-2 text-sm">새로운 메모를 추가하면 여기에 표시됩니다.</p>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
